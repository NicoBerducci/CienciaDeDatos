# Conexiones, pools y variables para el entorno LOCAL de desarrollo.
# Astro CLI las carga solas al hacer `astro dev start`, así que no hay que
# darlas de alta a mano desde la interfaz.
#
# Este archivo NO se versiona (está en .gitignore) justamente porque acá es
# donde irían contraseñas y tokens. La conexión de la PokéAPI no tiene ningún
# secreto -- es una API abierta -- pero se declara igual porque HttpOperator
# está diseñado para recibir un `http_conn_id` con la URL base.

airflow:
  connections:
    - conn_id: pokeapi
      conn_type: http
      conn_host: pokeapi.co
      conn_schema: https

      conn_login:
      conn_password:
      conn_port:
      conn_extra:
  pools:
    - pool_name:
      pool_slot:
      pool_description:
  variables:
    - variable_name:
      variable_value:
